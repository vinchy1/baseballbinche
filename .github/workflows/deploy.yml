name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_SITE: https://vinchy1.github.io
      ASTRO_BASE: /baseballbinche
      PUBLIC_NOINDEX: 'true'
      # Identifiants Formspree : à définir dans Settings > Secrets and variables > Actions > Variables
      PUBLIC_FORMSPREE_TRIAL: ${{ vars.PUBLIC_FORMSPREE_TRIAL }}
      PUBLIC_FORMSPREE_CONTACT: ${{ vars.PUBLIC_FORMSPREE_CONTACT }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
